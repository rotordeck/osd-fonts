name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Build site data
        run: uv run build.py
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: site

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Python tests (converters, catalog rules, symbol groups)
        run: uv run pytest -q
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: JavaScript tests
        run: |
          npm ci
          npm test
      - name: Browser tests
        run: |
          uv run build.py
          npx playwright install --with-deps chromium
          npm run test:browser
